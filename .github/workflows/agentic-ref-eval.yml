name: Agentic-reference eval

# Runs the agentic-reference (70x) case matrix. Dispatch-only: running these
# evals is a spend decision, so there is no PR/label trigger — a human picks
# the selection and repetition count each time.
#
# Dispatch this against a ref that carries the agentic-reference eval line —
# the agent-eval eval:agentic-ref and results:analyze scripts and the case
# registry they read. workflow_dispatch registers a workflow from the default
# branch but runs the file from the selected ref, so this workflow lives here
# while that line is still on a feature branch.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Comma-separated case names or globs, e.g. agentic-ref-cc-control-none-opus-high,agentic-ref-cc-docs-full-opus-high — empty runs every case'
        type: string
        default: ''
      flows:
        description: "Comma-separated workflow fixtures; a full name, a number (703), or a glob (70*) all work — empty runs each case's full workflow set"
        type: string
        default: ''
      runs:
        description: 'Repetitions per (case, workflow) cell (AGENTIC_REF_RUNS). Default 10, the batch size the comparison tooling expects'
        type: string
        default: '10'
      force:
        description: 'Run every selected cell again, even ones that already have saved results'
        type: boolean
        default: false
      dry:
        description: 'Dry run: resolve the selection and print the plan without spending'
        type: boolean
        default: false
      expect:
        description: 'Spend guard: fail before running unless the resolved plan is exactly this many evals (leave empty to skip the check)'
        type: string
        default: ''

env:
  TURBO_ENV_MODE: loose

# Dispatches queue rather than cancel: each one is paid work, and a cancelled
# run loses the cells it had already completed.
concurrency:
  group: agentic-ref-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Run agentic-reference cases
    runs-on: ubuntu-latest
    # Near the 360-minute ceiling for hosted runners, while a single eval run is
    # allowed up to 3 hours, so a large matrix can outlast the job. Completed
    # cells are fingerprint-cached, so re-dispatching the same selection resumes.
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Build local MCP packages
        run: pnpm --filter @storybook/addon-mcp... run build

      - name: Type check agent eval config
        run: pnpm --dir agent-eval run typecheck

      - name: Validate credentials
        shell: bash
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          missing=0

          # AI_GATEWAY_API_KEY must be validated here: the runner reacts to a
          # missing gateway key by skipping the experiment with exit 0, which
          # this job would report as success.
          for name in AI_GATEWAY_API_KEY VERCEL_PROJECT_ID VERCEL_TOKEN VERCEL_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing secret::$name is required to run sandboxed evals."
              missing=1
            fi
          done

          exit "$missing"

      - name: Resolve the selection
        shell: bash
        env:
          RAW_CASES: ${{ inputs.cases }}
          RAW_FLOWS: ${{ inputs.flows }}
        run: |
          # Cases arrive comma-separated; run-all wants one argument per case,
          # so normalize to spaces here and let the run step split.
          CASES=$(tr ',' ' ' <<< "$RAW_CASES" | tr -s ' ' | sed 's/^ //; s/ $//')

          # Flows may be full fixture names, bare numbers (703) or globs (70*).
          # Expand each token against agent-eval/evals/ on this ref, so the
          # runner only ever sees exact fixture names.
          FLOWS=""
          if [[ -n "$RAW_FLOWS" ]]; then
            resolved=()
            IFS=',' read -r -a tokens <<< "$RAW_FLOWS"
            for token in "${tokens[@]}"; do
              token=$(tr -d ' ' <<< "$token")
              [[ -z "$token" ]] && continue
              if [[ -d "agent-eval/evals/$token" ]]; then
                matches=("$token")
              else
                pattern="$token"
                # A bare number selects every fixture with that number prefix.
                [[ "$pattern" != *[*?]* ]] && pattern="$token-*"
                mapfile -t matches < <(cd agent-eval/evals && compgen -G "$pattern" || true)
              fi
              if [[ ${#matches[@]} -eq 0 ]]; then
                echo "::error title=Unknown flow::'$token' matches no fixture under agent-eval/evals/. Nothing was run."
                exit 1
              fi
              resolved+=("${matches[@]}")
            done
            FLOWS=$(printf '%s\n' "${resolved[@]}" | sort -u | paste -sd, -)
            echo "Flows resolved: $FLOWS"
          fi

          {
            echo "RESOLVED_CASES=$CASES"
            echo "RESOLVED_FLOWS=$FLOWS"
          } >> "$GITHUB_ENV"

      - name: Enforce the expected plan size
        if: ${{ inputs.expect != '' }}
        shell: bash
        env:
          CASES: ${{ env.RESOLVED_CASES }}
          EXPECT: ${{ inputs.expect }}
          AGENTIC_REF_FLOW: ${{ env.RESOLVED_FLOWS }}
          AGENTIC_REF_RUNS: ${{ inputs.runs }}
        run: |
          args=()
          if [[ -n "$CASES" ]]; then
            read -r -a case_args <<< "$CASES"
            args+=("${case_args[@]}")
          fi

          plan=$(pnpm --dir agent-eval run eval:agentic-ref:dry -- "${args[@]}")
          echo "$plan"
          resolved=$(grep -oE '[0-9]+ evals? to run' <<< "$plan" | grep -oE '^[0-9]+' | head -1)

          if [[ -z "$resolved" ]]; then
            echo "::error title=Spend guard::Could not read the resolved eval count from the dry-run plan."
            exit 1
          fi
          if [[ "$resolved" != "$EXPECT" ]]; then
            echo "::error title=Spend guard::The selection resolves to $resolved evals, but expect=$EXPECT. Nothing was run."
            exit 1
          fi
          echo "Plan matches: $resolved evals."

      - name: Run agentic-reference evals
        shell: bash
        env:
          CASES: ${{ env.RESOLVED_CASES }}
          DRY: ${{ inputs.dry }}
          FORCE: ${{ inputs.force }}
          AGENTIC_REF_FLOW: ${{ env.RESOLVED_FLOWS }}
          AGENTIC_REF_RUNS: ${{ inputs.runs }}
          # The runner drives coding agents through Vercel AI Gateway and skips
          # an experiment with exit 0 when this is unset — the job goes green
          # having run nothing.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The :dry variant is a separate script rather than a --dry argument:
          # pnpm consumes leading dashes before the script sees them.
          script=eval:agentic-ref
          [[ "$DRY" == "true" ]] && script=eval:agentic-ref:dry

          args=()
          [[ "$FORCE" == "true" ]] && args+=(--force)

          # Split on whitespace so each case reaches run-all as its own
          # argument, without the pathname expansion an unquoted $CASES would
          # get: a case glob like agentic-ref-cc-* must stay literal for
          # run-all to match it against experiment names.
          if [[ -n "$CASES" ]]; then
            read -r -a case_args <<< "$CASES"
            args+=("${case_args[@]}")
          fi

          pnpm --dir agent-eval run "$script" -- "${args[@]}"

      - name: Compute metrics and archive results
        if: ${{ always() && inputs.dry == false }}
        # Metrics are best-effort; an analysis failure must still leave the raw
        # results archivable. Missing results surface at upload instead.
        continue-on-error: true
        working-directory: agent-eval
        run: |
          # Writes analysis.json next to each run's result.json so the metrics
          # ride along in the uploaded artifact.
          pnpm results:analyze || echo "::warning title=Analysis failed::Archiving raw results without offline metrics."

          # Tar before upload: result files may contain characters that
          # actions/upload-artifact rejects.
          tar -czf ../agent-eval-results.tgz results

      - name: Upload eval results
        if: ${{ always() && inputs.dry == false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One artifact per dispatch, so every triggered run keeps its own
          # downloadable snapshot. scripts/download-ci-results.mjs matches on
          # the shared agent-eval-results prefix and merges them by experiment
          # name and timestamp.
          name: agent-eval-results-${{ github.run_id }}
          path: agent-eval-results.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Write run summary
        if: ${{ always() && inputs.dry == false }}
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node agent-eval/scripts/render-results-summary.mjs >> "$GITHUB_STEP_SUMMARY"
